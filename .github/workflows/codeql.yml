# Standalone CodeQL entry point (manual only).
# Prefer the PR/main suite in `.github/workflows/ci.yml` (required CI gate).
# Kept so CodeQL can still be run alone on an arbitrary ref.
name: CodeQL

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to analyze (default main)
        required: false
        default: main
        type: string

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          languages: javascript-typescript
          config-file: .codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          category: /language:javascript-typescript
