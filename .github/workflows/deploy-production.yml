# Production deploy on push to `main` only (no manual workflow_dispatch).
# Full essential gates before build/deploy (scanners stay in ci-deep.yml).
name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Validate deployment contract
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required variable: $key"
              exit 1
            fi
          done
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Essential quality gates
        run: |
          pnpm run lint:structure
          pnpm run lint
          pnpm run typecheck
          pnpm run test:fast
          pnpm run knip
          pnpm run test:eslint-rules
          pnpm run verify:element-ids

      - name: Build OpenNext bundle
        run: pnpm run build:cloudflare:ci
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CLOUDFLARE_WORKER_BUILD: "true"
          CLOUDFLARE_WORKERS_DEPLOY: "1"

      # Schema before code so new Worker code can rely on migrated tables.
      - name: Apply D1 migrations (production)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: pnpm run db:migrate:remote:production

      - name: Deploy to Cloudflare Workers (production)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy --env production
