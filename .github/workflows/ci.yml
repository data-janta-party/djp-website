# Essential CI
#
# | Trigger              | What runs                                      |
# |----------------------|------------------------------------------------|
# | push `dev`           | ESLint (+ structure) only                      |
# | push `main`          | Full essential suite + security scanners + gate|
# | pull_request         | Full essential suite + security scanners + gate|
# | workflow_dispatch    | Full essential suite on the selected ref       |
#
# Non-essential jscpd stays in `.github/workflows/ci-deep.yml`
# (nightly on main + manual any branch).
name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Full suite on main, PRs, and manual runs; lean ESLint-only on push to dev.
  RUN_FULL: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Lint structure rules
        run: pnpm run lint:structure

      - name: ESLint
        run: pnpm run lint

  quality:
    name: Quality
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: typecheck
            command: pnpm run typecheck
          - name: test-shard-1
            command: pnpm exec vitest run --config config/vitest.fast.config.ts --shard 1/2
          - name: test-shard-2
            command: pnpm exec vitest run --config config/vitest.fast.config.ts --shard 2/2
          - name: knip
            command: pnpm run knip
          - name: eslint-rules
            command: pnpm run test:eslint-rules && pnpm run verify:element-ids

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  e2e:
    name: E2E
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build app for production E2E server
        run: pnpm run build
        env:
          CLOUDFLARE_WORKER_BUILD: "true"

      - name: Run Playwright E2E
        run: pnpm run test:e2e
        env:
          CI: "true"

  build-cloudflare:
    name: Cloudflare build
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, e2e]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Build OpenNext Cloudflare bundle
        run: pnpm run build:cloudflare:ci
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CLOUDFLARE_WORKER_BUILD: "true"
          CLOUDFLARE_WORKERS_DEPLOY: "1"

  # Security scanners run on every PR / main / manual full suite (any feature branch via PR).
  semgrep:
    name: Semgrep
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-semgrep.txt

      - name: Run Semgrep
        run: |
          pip install -r requirements-semgrep.txt
          semgrep scan \
            --config=auto \
            --config=p/typescript \
            --config=p/react \
            --config=p/nextjs \
            --config=p/security-audit \
            --error

  codeql:
    name: CodeQL
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # SARIF upload when GitHub Advanced Security / code scanning is available
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          languages: javascript-typescript
          config-file: .codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          category: /language:javascript-typescript

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [eslint, quality, e2e, build-cloudflare, semgrep, codeql]
    steps:
      - name: Require required jobs to pass
        env:
          ESLINT: ${{ needs.eslint.result }}
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
          BUILD: ${{ needs.build-cloudflare.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          CODEQL: ${{ needs.codeql.result }}
          RUN_FULL: ${{ env.RUN_FULL }}
        run: |
          set -euo pipefail
          echo "eslint=$ESLINT quality=$QUALITY e2e=$E2E build=$BUILD semgrep=$SEMGREP codeql=$CODEQL run_full=$RUN_FULL"

          if [ "$ESLINT" != "success" ]; then
            echo "CI gate failed — ESLint did not succeed"
            exit 1
          fi

          # Full suite required on main / PRs / manual; skipped on push-to-dev is OK.
          if [ "$RUN_FULL" = "true" ]; then
            for name_result in "quality=$QUALITY" "e2e=$E2E" "build=$BUILD" "semgrep=$SEMGREP" "codeql=$CODEQL"; do
              result="${name_result#*=}"
              name="${name_result%%=*}"
              if [ "$result" != "success" ]; then
                echo "CI gate failed — $name=$result"
                exit 1
              fi
            done
          else
            for name_result in "quality=$QUALITY" "e2e=$E2E" "build=$BUILD" "semgrep=$SEMGREP" "codeql=$CODEQL"; do
              result="${name_result#*=}"
              name="${name_result%%=*}"
              if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
                echo "CI gate failed — $name=$result"
                exit 1
              fi
            done
          fi

          echo "CI gate passed"
